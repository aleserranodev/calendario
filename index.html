<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendario</title>

  <!-- Instalable como app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#E11D48">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <!-- iPhone -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calendario">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- PÁGINA DE PRUEBA (Fase 2): acceso, conexión con la API y sincronización.
       En la Fase 3 se sustituye por la app completa con calendario. -->
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text);
           padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    button { border: 0; border-radius: 10px; padding: 11px 14px; background: #3b82f6; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; }
    button.sec { background: var(--line); color: var(--text); }
    button.ok { background: #10b981; }
    button.del { background: #ef4444; }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; }
    .card { background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 8px 0; border-left: 6px solid #3b82f6; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .card.pendiente { border-left-style: dashed; }
    .actions { margin-top: 8px; display: flex; gap: 6px; }
    .err { background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 10px; display: none; margin-top: 8px; }
    .login { max-width: 360px; margin: 15vh auto 0; text-align: center; }
    .login img { width: 96px; height: 96px; border-radius: 22px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Acceso -->
  <section id="login" class="login" hidden>
    <img src="icons/icon-192.png" alt="">
    <h1>Nuestro calendario</h1>
    <p class="muted">Introduce tu código de acceso. Solo se pide una vez en cada móvil.</p>
    <input id="code" type="password" autocomplete="current-password" placeholder="Código de acceso">
    <button id="btnLogin" style="width:100%">Entrar</button>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- Prueba -->
  <section id="main" hidden>
    <h1>Prueba de conexión</h1>
    <div class="muted" id="who"></div>
    <div class="err" id="err"></div>
    <div class="row">
      <button id="btnMine">+ Evento mío</button>
      <button id="btnShared">+ Proponer compartido</button>
      <button class="sec" id="btnReload">Recargar</button>
      <button class="sec" id="btnLogout">Salir</button>
    </div>
    <div class="muted" id="sync"></div>
    <div id="lista"></div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
